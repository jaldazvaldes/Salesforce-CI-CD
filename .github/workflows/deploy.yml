name: Salesforce CI/CD Pipeline

on:
  pull_request:
    branches:
      - stg
      - qa
      - master
  push:
    branches:
      - stg
      - qa
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ==========================================
  # ENTORNO: STAGING (STG)
  # ==========================================
  validate-stg:
    name: 🔍 Validar en STG
    if: github.event_name == 'pull_request' && github.base_ref == 'stg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @salesforce/cli
      - name: Authenticate & Validate
        run: |
          echo "${{ secrets.STG_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a stg-org
          sf project deploy start --dry-run --target-org stg-org

  deploy-stg:
    name: 🚀 Desplegar en STG
    if: github.event_name == 'push' && github.ref_name == 'stg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @salesforce/cli
      - name: Authenticate & Deploy
        run: |
          echo "${{ secrets.STG_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a stg-org
          sf project deploy start --target-org stg-org

  # ==========================================
  # ENTORNO: QUALITY ASSURANCE (QA)
  # ==========================================
  validate-qa:
    name: 🔍 Validar en QA
    if: github.event_name == 'pull_request' && github.base_ref == 'qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @salesforce/cli
      - name: Authenticate & Validate
        run: |
          echo "${{ secrets.QA_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a qa-org
          sf project deploy start --dry-run --target-org qa-org

  deploy-qa:
    name: 🚀 Desplegar en QA
    if: github.event_name == 'push' && github.ref_name == 'qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @salesforce/cli
      - name: Authenticate & Deploy
        run: |
          echo "${{ secrets.QA_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a qa-org
          sf project deploy start --target-org qa-org

  # ==========================================
  # ENTORNO: PRODUCCIÓN (PRO)
  # ==========================================
  validate-pro:
    name: 🔍 Validar en PRO
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @salesforce/cli
      - name: Authenticate & Validate
        run: |
          echo "${{ secrets.PRO_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a pro-org
          sf project deploy start --dry-run --target-org pro-org

  deploy-pro:
    name: 🏆 Desplegar en Producción
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @salesforce/cli
      - name: Authenticate & Deploy
        run: |
          echo "${{ secrets.PRO_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a pro-org
          sf project deploy start --target-org pro-org

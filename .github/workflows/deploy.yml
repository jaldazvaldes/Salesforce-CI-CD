name: Salesforce Multi-Environment Deployment

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, closed]

jobs:
  # ==========================================
  # ENTORNO: STAGING (STG)
  # ==========================================
  validate_stg:
    name: 🔍 Validar en STG
    # Se ejecuta cuando la PR está abierta (no mergeada)
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    # Aunque no es un despliegue, asignamos entorno si queremos usar el secreto
    environment: stg
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce STG
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a stg-org

      - name: Validar Componentes (Checkonly)
        run: sf project deploy start --dry-run --target-org stg-org

  deploy_stg:
    name: 🚀 Desplegar en STG
    if: github.event.pull_request.merged == false
    needs: validate_stg
    environment: stg 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce STG
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a stg-org

      - name: Desplegar Componentes
        run: sf project deploy start --target-org stg-org

  # ==========================================
  # ENTORNO: QUALITY ASSURANCE (QA)
  # ==========================================
  validate_qa:
    name: 🔍 Validar en QA
    if: github.event.pull_request.merged == false
    needs: deploy_stg
    environment: qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce QA
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a qa-org

      - name: Validar Componentes (Checkonly)
        run: sf project deploy start --dry-run --target-org qa-org

  deploy_qa:
    name: 🚀 Desplegar en QA
    if: github.event.pull_request.merged == false
    needs: validate_qa
    environment: qa 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce QA
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a qa-org

      - name: Desplegar Componentes
        run: sf project deploy start --target-org qa-org

  # ==========================================
  # ENTORNO: PRODUCCIÓN (PRO) - Al hacer Merge
  # ==========================================
  deploy_pro:
    name: 🏆 Desplegar en Producción
    # Se ejecuta SOLO cuando la PR se ha mergeado en master
    if: github.event.pull_request.merged == true
    environment: pro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce PRO
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a pro-org

      - name: Desplegar Componentes
        run: sf project deploy start --target-org pro-org
